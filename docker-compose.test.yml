services:
  postgres_test:
    image: postgres:16
    container_name: trace-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace_test
    volumes:
     - trace_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      
volumes:
  trace_pg_test_data: