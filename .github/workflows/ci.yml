name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trace -d trace_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # CI uses the Postgres service running on localhost:5432
      DATABASE_URL: postgresql://trace:trace@localhost:5432/trace_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply DB migrations (test DB)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npx vitest run --config vitest.integration.config.ts
